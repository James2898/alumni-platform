services:
  # 1. Relational Database Tier (MySQL 8.0)
  alumni-db:
    image: mysql:8.0
    container_name: alumni-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-alumni_db}
      MYSQL_USER: ${DB_USER:-alumni_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-alumni_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - alumni-net

  # 2. Object Storage Tier (MinIO S3-Compatible Storage)
  alumni-storage:
    image: minio/minio:latest
    container_name: alumni-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alumni-net

  # 3. MinIO Bucket Initialization Helper
  alumni-storage-init:
    image: minio/mc:latest
    container_name: alumni-storage-init
    depends_on:
      alumni-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://alumni-storage:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET:-alumni-media};
      /usr/bin/mc anonymous set download local/${MINIO_BUCKET:-alumni-media};
      echo 'MinIO S3 bucket alumni-media initialized with public download policy';
      exit 0;
      "
    networks:
      - alumni-net

  # 4. Application Tier (Go REST API with Air live-reload)
  alumni-api:
    build:
      context: ./backend
      target: dev
    container_name: alumni-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      APP_ENV: development
      DB_HOST: alumni-db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-alumni_user}
      DB_PASSWORD: ${DB_PASSWORD:-alumni_secret}
      DB_NAME: ${DB_NAME:-alumni_db}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-for-development-32chars}
      MINIO_ENDPOINT: alumni-storage:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-alumni-media}
      MINIO_USE_SSL: "false"
    volumes:
      - ./backend:/app
      - /app/tmp
    depends_on:
      alumni-db:
        condition: service_healthy
      alumni-storage:
        condition: service_healthy
    networks:
      - alumni-net

  # 5. Client Tier (React 19 TypeScript + Vite)
  alumni-web:
    build:
      context: ./frontend
      target: dev
    container_name: alumni-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://alumni-api:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - alumni-api
    networks:
      - alumni-net

volumes:
  mysql_data:
    name: alumni_mysql_data
  minio_data:
    name: alumni_minio_data

networks:
  alumni-net:
    name: alumni_network
    driver: bridge

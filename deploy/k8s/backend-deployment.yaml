apiVersion: apps/v1
kind: Deployment
metadata:
  name: alumni-backend
  namespace: alumni-platform
  labels:
    app.kubernetes.io/name: alumni-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: alumni-management-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alumni-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alumni-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: alumni-management-system
    spec:
      containers:
        - name: backend
          image: alumni-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: alumni-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: alumni-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alumni-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alumni-secrets
                  key: JWT_SECRET
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: alumni-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alumni-secrets
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

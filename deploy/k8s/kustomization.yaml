apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alumni-platform

resources:
  - namespace.yaml
  - configmaps.yaml
  - secrets.yaml
  - mysql.yaml
  - minio.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

images:
  - name: alumni-api
    newName: alumni-api
    newTag: latest
  - name: alumni-web
    newName: alumni-web
    newTag: latest

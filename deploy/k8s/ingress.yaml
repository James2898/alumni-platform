apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alumni-ingress
  namespace: alumni-platform
  labels:
    app.kubernetes.io/name: alumni-ingress
    app.kubernetes.io/part-of: alumni-management-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: alumni-backend-svc
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: alumni-backend-svc
                port:
                  number: 8080
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: alumni-backend-svc
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alumni-frontend-svc
                port:
                  number: 80
